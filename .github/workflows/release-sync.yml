# Deprecated: use release-deploy.yml (builds APK + web + hosting).
# Kept so old links still work; only runs Firestore sync on manual dispatch.

name: Release sync (metadata only)

on:
  workflow_dispatch:

jobs:
  firestore-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-release-from-git.mjs
      - run: npm ci
        working-directory: functions
      - name: Sync Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "APP_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('vyoma-ui/public/releases.json','utf8')).appVersion")" >> "$GITHUB_ENV"
          node scripts/sync-firestore-app-version.mjs
